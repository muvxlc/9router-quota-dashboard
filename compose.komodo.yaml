services:
  quota-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quota-dashboard
    restart: unless-stopped
    ports:
      - "${BIND_IP:?set BIND_IP}:20130:20130"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "20130"
      APP_ORIGIN: "${APP_ORIGIN:?set APP_ORIGIN}"
      UPSTREAM_BASE_URL: "${UPSTREAM_BASE_URL:-https://9router.bangkhan.com}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:20130/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
